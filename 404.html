<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - STACKLY</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(247, 249, 247, 0.95), rgba(247, 249, 247, 0.95)), url('assets/images/about_farming.webp') center/cover no-repeat;
            padding: 24px;
            text-align: center;
        }
        .error-content h1 {
            font-size: 8rem;
            color: var(--primary-green);
            line-height: 1;
            margin-bottom: 16px;
            text-shadow: 0 4px 10px rgba(37, 93, 55, 0.2);
        }
        .error-content h2 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .error-content p {
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 32px;
        }
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-content reveal">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 40px;"><img src="assets/images/logo.webp" alt="STACKLY" style="height: 60px; width: auto;"></a>
            
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>Oops! The page you're looking for seems to have wandered off the field. Let's get you back on track.</p>
            
            <div class="error-actions">
                <button onclick="window.history.back()" class="btn btn-secondary">
                    <i class="ph-bold ph-arrow-left"></i> Go Back
                </button>
                <a href="index.html" class="btn btn-primary">
                    <i class="ph-bold ph-house"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="assets/js/animations.js"></script>
</body>
</html>
